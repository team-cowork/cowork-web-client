# cowork-client 배포용 Docker Compose.
# 단일 VM 에서 앱별 정적 컨테이너 4개 + 앞단 라우팅 nginx 1개를 띄운다.
# 배포: `docker compose pull && docker compose up -d`
# 단일 앱 재배포: `docker compose pull chat && docker compose up -d chat`
#
# `image` 와 `build` 를 함께 둬서 프로덕션은 ghcr pull, 로컬 검증은 `docker compose build` 가 모두 가능하다.

services:
  shell:
    image: ghcr.io/team-cowork/cowork-web-client/shell:${IMAGE_TAG:-develop}
    build:
      context: .
      args:
        APP: shell
        ASSET_PREFIX: /
        SUBPATH: ""
    expose:
      - "80"
    restart: unless-stopped

  chat:
    image: ghcr.io/team-cowork/cowork-web-client/cowork-chat:${IMAGE_TAG:-develop}
    build:
      context: .
      args:
        APP: cowork-chat
        ASSET_PREFIX: /_mf/chat/
        SUBPATH: _mf/chat/
    expose:
      - "80"
    restart: unless-stopped

  issue:
    image: ghcr.io/team-cowork/cowork-web-client/cowork-issue:${IMAGE_TAG:-develop}
    build:
      context: .
      args:
        APP: cowork-issue
        ASSET_PREFIX: /_mf/issue/
        SUBPATH: _mf/issue/
    expose:
      - "80"
    restart: unless-stopped

  profile:
    image: ghcr.io/team-cowork/cowork-web-client/cowork-profile:${IMAGE_TAG:-develop}
    build:
      context: .
      args:
        APP: cowork-profile
        ASSET_PREFIX: /_mf/profile/
        SUBPATH: _mf/profile/
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - shell
      - chat
      - issue
      - profile
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      CHAT_REMOTE_URL: ${CHAT_REMOTE_URL:-/_mf/chat/mf-manifest.json}
      ISSUE_REMOTE_URL: ${ISSUE_REMOTE_URL:-/_mf/issue/mf-manifest.json}
      PROFILE_REMOTE_URL: ${PROFILE_REMOTE_URL:-/_mf/profile/mf-manifest.json}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/config.js.template:/etc/nginx/config.js.template:ro
      - ./nginx/docker-entrypoint.d/40-config-js.sh:/docker-entrypoint.d/40-config-js.sh:ro
    restart: unless-stopped
