services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: cowork-client:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-cowork-client}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
