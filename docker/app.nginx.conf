# 각 앱 컨테이너의 정적 서빙 설정.
# shell 은 SPA 라 존재하지 않는 경로를 /index.html 로 폴백한다.
# 네임드 로케이션(@fallback)을 써서 /index.html 이 없을 때 내부 리다이렉트 루프(500)가 아닌 404 를 반환한다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ @fallback;
  }

  location @fallback {
    try_files /index.html =404;
  }
}
