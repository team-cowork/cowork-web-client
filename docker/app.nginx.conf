# 각 앱 컨테이너의 정적 서빙 설정.
# shell 은 SPA 라 /index.html 로 폴백한다.
# remote 컨테이너는 자기 SUBPATH(_mf/<app>/) 하위의 에셋·mf-manifest.json 만 서빙하며,
# 존재하지 않는 경로는 404(루트 /index.html 부재)로 떨어지므로 폴백 영향이 없다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
