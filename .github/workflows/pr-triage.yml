name: PR Triage

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    name: Assign author & reviewers
    runs-on: ubuntu-latest
    # 드래프트 PR은 리뷰 준비가 되면(ready_for_review) 처리한다.
    if: github.event.pull_request.draft == false
    steps:
      - name: Assign assignee & reviewers
        uses: hkusu/review-assign-action@v1.4.0
        with:
          # assignee는 PR 작성자로 고정
          assignees: ${{ github.event.pull_request.user.login }}
          # 리뷰어 = team-cowork/cowork-client 팀 멤버 전원 요청
          # (PR 작성자는 자동으로 제외됩니다. max-num-of-reviewers 미설정 시 전원 요청)
          reviewers: >-
            Dino0204, junjuny0227, LeeSangHyeok0731, yeondon125, hyooeunn
