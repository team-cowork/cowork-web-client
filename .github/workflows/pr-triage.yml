name: PR Triage

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    name: Assign author & reviewers
    runs-on: ubuntu-latest
    # 드래프트 PR은 리뷰 준비가 되면(ready_for_review) 처리한다.
    if: github.event.pull_request.draft == false
    steps:
      - name: Assign assignee & reviewers
        uses: hkusu/review-assign-action@v1.4.0
        with:
          # assignee는 PR 작성자로 고정
          assignees: ${{ github.event.pull_request.user.login }}
          # 리뷰어 후보 풀 = team-cowork/cowork-client 팀 멤버
          # (PR 작성자는 자동으로 후보에서 제외됩니다)
          reviewers: >-
            aiden30015, snowykte0426, Dino0204, h-0y28, junjuny0227,
            LeeSangHyeok0731, yeondon125, ryusuye0n, hyooeunn
          # 후보 중 무작위 2명 요청
          max-num-of-reviewers: 2
