name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Apply labels
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Run labeler
        uses: actions/labeler@v6
        with:
          # 매칭이 사라져도 기존 라벨은 제거하지 않고 추가만 한다.
          sync-labels: false
