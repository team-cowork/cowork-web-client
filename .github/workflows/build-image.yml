name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check required variables
        if: ${{ vars.NEXT_PUBLIC_BASE_URL == '' }}
        run: |
          echo '::error::NEXT_PUBLIC_BASE_URL 변수가 설정되지 않았습니다'
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: web-client-deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_GHCR_USER: ${{ github.actor }}
          DEPLOY_GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 10m
          envs: DEPLOY_SHA,DEPLOY_GHCR_USER,DEPLOY_GHCR_TOKEN
          script: |
            set -euo pipefail
            umask 077
            export -n DEPLOY_GHCR_TOKEN
            cd ~/cowork-web-client
            docker_config="$(mktemp -d)"
            trap 'rm -rf -- "$docker_config"' EXIT
            export DOCKER_CONFIG="$docker_config"
            printf '%s' "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io \
              --username "$DEPLOY_GHCR_USER" --password-stdin
            unset DEPLOY_GHCR_TOKEN DEPLOY_GHCR_USER
            curl -fsSL -o compose.yml \
              "https://raw.githubusercontent.com/${{ github.repository }}/${DEPLOY_SHA}/compose.yml"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
