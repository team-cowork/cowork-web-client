name: Deploy

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    env:
      # 브랜치별로 컨테이너/이미지/포트를 분리해 gsm sv 서버에서 공존시킨다.
      COMPOSE_PROJECT_NAME: cowork-client-${{ github.ref_name }}
      CONTAINER_NAME: cowork-client-${{ github.ref_name }}
      IMAGE_TAG: ${{ github.ref_name }}
      HOST_PORT: ${{ github.ref_name == 'main' && '3000' || '3001' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy .env
        run: cp "${{ secrets.DEPLOY_ENV_PATH }}" .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          NEXT_PUBLIC_API_URL=$(grep -E '^NEXT_PUBLIC_API_URL=' .env | cut -d= -f2-)
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}" \
            -t cowork-client:${IMAGE_TAG} \
            -t cowork-client:${IMAGE_TAG}-${{ github.sha }} \
            .

      - name: Deploy container
        run: |
          export NEXT_PUBLIC_API_URL=$(grep -E '^NEXT_PUBLIC_API_URL=' .env | cut -d= -f2-)
          docker compose down --remove-orphans || true
          docker compose up -d

      - name: Verify frontend status
        run: |
          MAX=12
          for i in $(seq 1 $MAX); do
            echo "Waiting for frontend... ($i/$MAX)"
            if docker compose ps frontend | grep -q "Up"; then
              echo "frontend is Up."
              docker compose ps frontend
              exit 0
            fi
            if [ "$i" -eq "$MAX" ]; then
              echo "Timeout: frontend did not become healthy within $((MAX * 5)) seconds."
              docker compose logs frontend --tail=50
              exit 1
            fi
            sleep 5
          done

      - name: Remove dangling images
        run: docker image prune -f
