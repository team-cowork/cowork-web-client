name: Build, Push & Deploy

# develop push 시 앱별 정적 이미지를 빌드해 ghcr 에 push 한다.
# NOTE: VM 테스트 동안 임시로 기능 브랜치 트리거. 머지 전 [develop] 으로 되돌릴 것.
on:
  push:
    branches: [feat/global-docker-deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: shell
            asset_prefix: /
            subpath: ""
          - app: cowork-chat
            asset_prefix: /_mf/chat/
            subpath: _mf/chat/
          - app: cowork-issue
            asset_prefix: /_mf/issue/
            subpath: _mf/issue/
          - app: cowork-profile
            asset_prefix: /_mf/profile/
            subpath: _mf/profile/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 캐시된 잘못된 레이어 방지 — 깨끗한 빌드 (안정화 후 캐시 재도입 가능)
          no-cache: true
          build-args: |
            APP=${{ matrix.app }}
            ASSET_PREFIX=${{ matrix.asset_prefix }}
            SUBPATH=${{ matrix.subpath }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:develop
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # 빌드된 이미지를 VM 에 배포 (Flooding 패턴: scp 로 파일 전송 → ssh 로 compose 기동)
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: develop
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # compose.yaml 과 nginx 설정을 VM 의 ~/cowork 로 복사
      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "compose.yaml,nginx/"
          target: "cowork"
          overwrite: true

      # VM 에서 .env 생성 → ghcr 로그인(워크플로우 토큰) → pull → up
      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            # Docker 미설치 시 1회 설치 (passwordless sudo 가정)
            docker --version >/dev/null 2>&1 || curl -fsSL https://get.docker.com | sudo sh
            cd ~/cowork
            chmod +x nginx/docker-entrypoint.d/*.sh || true
            cat > .env <<EOF
            IMAGE_TAG=develop
            SERVER_NAME=_
            CHAT_REMOTE_URL=/_mf/chat/mf-manifest.json
            ISSUE_REMOTE_URL=/_mf/issue/mf-manifest.json
            PROFILE_REMOTE_URL=/_mf/profile/mf-manifest.json
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 배포 결과를 Actions Summary 에 ASCII 배너로 출력
      - name: Deployment summary
        if: success()
        run: |
          SHORT=${GITHUB_SHA::7}
          {
            echo '```'
            echo '=================================================='
            echo '   DEPLOY SUCCESS  -  develop'
            echo '=================================================='
            echo "   ENV       : develop"
            echo "   IMAGE TAG : develop (${SHORT})"
            echo "   BRANCH    : ${GITHUB_REF_NAME}"
            echo "   SERVICES  : shell  chat  issue  profile  nginx"
            echo "   ROUTES    : /  /_mf/chat/  /_mf/issue/  /_mf/profile/"
            echo '=================================================='
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # push 이벤트이므로 브랜치의 PR 번호를 해석
      - name: Resolve PR number
        id: pr
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "number=$(gh pr list --head "$GITHUB_REF_NAME" --json number -q '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      # PR 에 배포 결과를 스티키 코멘트(1개 유지)로 남김
      - name: Sticky PR comment
        if: success() && steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: deploy-develop
          message: |
            ```
            ==================================================
               DEPLOY SUCCESS  -  develop
            ==================================================
               IMAGE TAG : develop (${{ github.sha }})
               SERVICES  : shell  chat  issue  profile  nginx
            ==================================================
            ```
