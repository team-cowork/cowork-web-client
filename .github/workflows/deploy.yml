name: Build & Push Images

# develop push 시 앱별 정적 이미지를 빌드해 ghcr 에 push 한다.
# NOTE: VM 테스트 동안 임시로 기능 브랜치 트리거. 머지 전 [develop] 으로 되돌릴 것.
on:
  push:
    branches: [feat/global-docker-deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: shell
            asset_prefix: /
            subpath: ""
          - app: cowork-chat
            asset_prefix: /_mf/chat/
            subpath: _mf/chat/
          - app: cowork-issue
            asset_prefix: /_mf/issue/
            subpath: _mf/issue/
          - app: cowork-profile
            asset_prefix: /_mf/profile/
            subpath: _mf/profile/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP=${{ matrix.app }}
            ASSET_PREFIX=${{ matrix.asset_prefix }}
            SUBPATH=${{ matrix.subpath }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:develop
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
